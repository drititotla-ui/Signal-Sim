# ==============================================================================
# SIGNALSIM-INDIA: Scenario S4 Configuration
# Milestone: P2-M01 (Foundation)
# Status: PROVISIONAL EXPERIMENTAL ASSUMPTION — PENDING P1 CAPACITY VALIDATION
# ==============================================================================
# S4 represents an oversaturated, peak congestion regime (125% nominal demand).
#
# NOTE: The demand multiplier (1.25) is an experimental assumption, NOT a verified
# empirical traffic statistic. Baseline design volume (100% capacity) must be
# validated against P1's geometric network capacity once P1 completes the network.
# ==============================================================================

scenario:
  id: "S4"
  name: "Oversaturated / Peak Congestion"
  description: "Oversaturated demand regime (125% of nominal baseline capacity) to evaluate controller resilience under severe spillback and queue accumulation."
  
  # Demand Multiplier relative to baseline design capacity (1.00)
  demand_multiplier: 1.25

  # Traffic regime classification
  regime: "oversaturated"
  is_provisional: true
  status: "PENDING_P1_VALIDATION"

# ------------------------------------------------------------------------------
# Fleet Vehicle Composition (Pending P1 Vehicle Type Definitions)
# ------------------------------------------------------------------------------
vehicle_composition:
  placeholder: "<PENDING_P1_FLEET_MIX>"
  classes:
    two_wheeler:
      vtype_id: "<PENDING_P1_VTYPE_2W>"
      target_share_pct: "<PENDING_P1_SHARE_2W>"
    three_wheeler_auto:
      vtype_id: "<PENDING_P1_VTYPE_3W>"
      target_share_pct: "<PENDING_P1_SHARE_3W>"
    passenger_car:
      vtype_id: "<PENDING_P1_VTYPE_CAR>"
      target_share_pct: "<PENDING_P1_SHARE_CAR>"
    bus:
      vtype_id: "<PENDING_P1_VTYPE_BUS>"
      target_share_pct: "<PENDING_P1_SHARE_BUS>"
    light_commercial_vehicle:
      vtype_id: "<PENDING_P1_VTYPE_LCV>"
      target_share_pct: "<PENDING_P1_SHARE_LCV>"

# ------------------------------------------------------------------------------
# Turning Movement Proportions
# ------------------------------------------------------------------------------
# In left-hand traffic (LHT), left turns are unobstructed/filter turns, through
# movements are primary, and right turns cross opposing traffic.
# Agreed proportions: left 20%, straight 60%, right 20%
turning_proportions:
  left: 0.20
  straight: 0.60
  right: 0.20

# ------------------------------------------------------------------------------
# Scenario-Specific Settings
# ------------------------------------------------------------------------------
scenario_settings:
  expected_congestion_level: "severe"
  saturation_index_target: "<PENDING_P1_SATURATION_S4>"
  notes: "Residual queues persist across cycles; tests queue management, prevention of upstream gridlock, and throughput degradation."

